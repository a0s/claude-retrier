name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Both, always: the pty and shell behaviour this wrapper depends on is where
    # macOS and Linux differ, so a green run on one says little about the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # zsh ships with macOS but not with the Ubuntu runner, and the alias tests
      # skip themselves when it is missing — a silent gap in exactly the feature
      # most users rely on.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Versions
        run: |
          bash --version | head -1
          zsh --version
          python3 --version
          echo "SHELL=${SHELL:-unset} HOME=$HOME TERM=${TERM:-unset}"
          echo "sh -> $(readlink -f /bin/sh)"

      - name: Run the suite
        run: |
          set -o pipefail
          ./test/run.sh 2>&1 | tee /tmp/suite.log && exit 0
          # Surface the failure as an annotation as well as in the log: annotations
          # are readable from the public API, so a failure here can be diagnosed
          # without repository admin rights.
          echo "::error::$(grep -E 'FAIL|Error|Traceback|assert' /tmp/suite.log | head -20 | tr '\n' '§')"
          exit 1
